    <meta name="theme-color" content="#eeedea" />
    <script>
      /* set the theme before React mounts, so there is no light flash */
      (function () {
        try {
          var s = localStorage.getItem("fz-theme");
          var d = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (d) document.documentElement.classList.add("dark");
          var l = localStorage.getItem("fz-lang");
          if (!l) l = (navigator.language || "").toLowerCase().indexOf("fr") === 0 ? "fr" : "en";
          document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
